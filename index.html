function budgetMini(r){let b=budgetFor(r),s=summary(r),pct=b.total?s.budgetSpent/b.total*100:0;let cats=Object.entries(b.categories||{}).filter(x=>x[1]>0);return `<div class="card"><div class="card-title"><h2>本月预算</h2><button class="text-btn" onclick="openBudget('month','${TODAY}')">管理 ${icon('chevron',13)}</button></div><div class="between"><span class="muted small">已用 ${b.total?Math.round(pct)+'%':'—'}</span><span class="small num">${money(s.budgetSpent)} <span class="muted">/ ${money(b.total)}</span></span></div><div class="progress"><div class="progress-fill" style="width:${Math.min(100,pct)}%;${pct>100?'background:#ce9483':''}"></div></div><div class="between tiny muted"><span>剩余 ${b.total?money(b.total-s.budgetSpent):'未设置'}</span><span>${r.elapsed} / ${r.total} 天</span></div>${cats.slice(0,3).map(([c,total])=>{let spent=s.rows.filter(t=>t.type==='expense'&&t.budget&&t.cat===c).reduce((n,t)=>n+t.cny,0);return `<div class="mini-budget"><div class="between small"><span>${CATSTYLE[c]?.[0]||''} ${esc(c)}</span><span class="muted num">${money(spent)} / ${total}</span></div><div class="progress"><div class="progress-fill" style="width:${Math.min(100,spent/total*100)}%;background:#c1cdb4"></div></div></div>`}).join('')}</div>`}
function assetCard(){let total=0,missing=false;for(let a of state.accounts.filter(a=>a.include&&!(a.pendingCurrencies||[]).length))for(let c of a.currencies){if(c!=='CNY'&&!state.rates[c]&&balance(a,c)!==0)missing=true;else total+=balance(a,c)*(state.rates[c]||1)}return `<div class="card"><div class="card-title"><h2>我的资产</h2><button class="text-btn" onclick="view='settings';settingsTab='accounts';render()">查看 ${icon('chevron',13)}</button></div><span class="tiny muted">${state.accounts.some(a=>(a.pendingCurrencies||[]).length)?'已校准账户净资产 · 未含待校准账户':'净资产 · 折合人民币'}</span><div class="asset-total num">${missing?'—':money(total)}</div>${missing?'<p class="help">获取汇率后计算完整净资产</p>':''}${state.accounts.filter(a=>a.active).slice(0,3).map(a=>`<button class="asset-item asset-link" onclick="openAccountBills('${a.id}')" aria-label="查看${esc(a.name)}账户明细"><div class="flex"><span class="asset-icon">${icon('wallet',15)}</span><span>${esc(a.name)}</span></div><b class="num">${(a.pendingCurrencies||[]).includes(a.currencies[0])?'待校准':money(balance(a,a.currencies[0]),a.currencies[0])}</b></button>`).join('')}<div class="insight">${icon('shield',13)} 负债以负数计入，停用账户仍保留余额。</div></div>`}
function entryPage(){let r=range('month',TODAY);return `<div class="heading"><div><h1>记账</h1></div><div class="pill">${icon('calendar',14)} ${TODAY.replaceAll('-',' / ')}</div></div>${totalsCards(r)}<div class="workspace"><div><div class="card entry-card"><div class="between"><div class="flex"><span class="spark">${icon('spark',20)}</span><div><h2>轻松记一笔</h2><div class="tiny muted" style="margin-top:5px">像聊天一样，记录你的日常</div></div></div><span class="badge">文字识别</span></div><textarea id="quick-text" aria-label="输入记账内容" placeholder="今天花了什么？比如，午餐 23.5 元"></textarea><div class="entry-bottom between"><div class="flex"><select class="account-select" id="quick-account" aria-label="扣款账户">${state.accounts.filter(a=>a.active).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select><span class="help">自动识别金额、币种与分类</span></div><button class="btn" onclick="parseQuick()">识别并记账 ${icon('arrow',16)}</button></div><div class="examples"><button onclick="$('#quick-text').value='午餐23.5元'">🍜 午餐 23.5 元</button><button onclick="$('#quick-text').value='咖啡5美刀'">☕ 咖啡 5 美刀</button><button onclick="$('#quick-text').value='工资收入18000元'">💼 工资到账</button><button onclick="openTx()">手动记账 +</button></div></div></div><aside class="stack rail">${budgetMini(r)}${assetCard()}${ratesCard()}</aside></div>`}
function monthCalendar(r){let totals=new Map();for(let t of summary(r).rows)if(t.type==='expense')totals.set(t.date,round((totals.get(t.date)||0)+t.cny));let offset=(dateObj(r.start).getDay()+6)%7,cells=Array.from({length:offset},()=>'<span class="calendar-blank" aria-hidden="true"></span>'),max=Math.max(1,...totals.values());for(let d=r.start;d<=r.end;d=addDays(d,1)){let amount=totals.get(d)||0,selected=!allBills&&calendarDay===d;cells.push(`<button id="calendar-${d}" class="calendar-day ${selected?'selected':''} ${d===TODAY?'today':''}" aria-label="${d} 支出 ${money(amount)}" aria-pressed="${selected}" onclick="selectCalendarDay('${d}')" style="--day-shade:${amount?(.035+.1*amount/max).toFixed(3):0}" title="${d} · ${money(amount)}"><span class="calendar-date">${Number(d.slice(8))}${d===TODAY?'<i></i>':''}</span><span class="calendar-amount num ${amount?'':'muted'}">${amount?money(amount).replace('¥ ',''):'—'}</span></button>`)}while(cells.length%7)cells.push('<span class="calendar-blank" aria-hidden="true"></span>');return `<section class="card expense-calendar"><div class="card-title"><h2>每日支出</h2><span class="tiny muted">${r.label} · 人民币</span></div><div class="calendar-weekdays">${['一','二','三','四','五','六','日'].map(d=>`<span>${d}</span>`).join('')}</div><div class="calendar-grid">${cells.join('')}</div>${!allBills&&calendarDay?`<div class="calendar-selection between"><span class="small">${calendarDay.replaceAll('-',' / ')} · ${money(totals.get(calendarDay)||0)}</span><button class="text-btn" onclick="selectCalendarDay('')">查看整月</button></div>`:''}</section>`}
function selectCalendarDay(date){let r=range('month',anchor);if(date&&(date<r.start||date>r.end||!/^\d{4}-\d{2}-\d{2}$/.test(date)))return;calendarDay=date;allBills=false;render()}
function toggleAllBills(){allBills=!allBills;calendarDay='';render()}
function selectTrendDay(date){let r=range();if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<r.start||date>r.end)return;trendDay=date;render()}
function trendDayKey(event,date){let r=range(),next=date;if(event.key==='ArrowLeft')next=addDays(date,-1);else if(event.key==='ArrowRight')next=addDays(date,1);else if(event.key!=='Enter'&&event.key!==' ')return;event.preventDefault();if(next<r.start||next>r.end)return;selectTrendDay(next);$('.trend-day-hit[aria-pressed="true"]')?.focus()}
function accountBillRows(id,all=true,month=TODAY){let r=range('month',month);return state.transactions.filter(t=>(t.type==='transfer'?(t.from===id||t.to===id):t.account===id)&&(all||t.date>=r.start&&t.date<=r.end))}
function openAccountBills(id,all=true,month=TODAY){let a=acc(id);if(!a)return;let r=range('month',month),rows=accountBillRows(id,all,month),s=summary({start:all?'0000-01-01':r.start,end:all?'9999-12-31':r.end},rows),prev=addDays(r.start,-1),next=addDays(r.end,1);modal(esc(a.name)+' · 账户明细',`<div class="account-bills-toolbar"><div class="tabs"><button class="${all?'active':''}" onclick="openAccountBills('${id}',true,'${r.start}')">全部</button><button class="${all?'':'active'}" onclick="openAccountBills('${id}',false,'${r.start}')">按月</button></div>${all?'':`<div class="date-picker"><button aria-label="账户明细上个月" onclick="openAccountBills('${id}',false,'${prev}')">${icon('left',16)}</button><span>${r.label}</span><button aria-label="账户明细下个月" onclick="openAccountBills('${id}',false,'${next}')">${icon('chevron',16)}</button></div>`}</div><div class="account-bills-balances">${a.currencies.map(c=>`<span class="pill">${CUR[c]} ${a.pendingCurrencies?.includes(c)?'待校准':money(balance(a,c),c)}</span>`).join('')}</div><div class="between category-bills-summary"><span class="small muted">${rows.length} 笔</span><div class="small num account-bills-totals"><span>支出 ${money(s.expense)}</span><span class="green">收入 ${money(s.income)}</span></div></div><div class="category-bills">${rows.length?txRows(rows,0,id):'<div class="empty">暂无该账户账单</div>'}</div>`,`<button class="btn secondary" onclick="closeModal()">关闭</button>`)}
function detailsPage(){let r=range('month',anchor);if(calendarDay&&(calendarDay<r.start||calendarDay>r.end))calendarDay='';let txs=filteredBills();return `<div class="heading"><div><h1>账单明细</h1><p>把日子摊开，每一笔都清清楚楚。</p></div><div class="page-actions">${picker()}<button class="btn" onclick="openTx()">${icon('plus',16)} 记一笔</button></div></div>${monthCalendar(r)}<div class="card"><div class="card-title"><div class="flex"><h2>${allBills?'全部账单':calendarDay?calendarDay+' 账单':'本月账单'}</h2><span id="bill-count" class="muted tiny">${txs.length} 笔</span></div><button class="text-btn" onclick="toggleAllBills()">${allBills?'返回本月':'查看全部账单'} ${icon('chevron',14)}</button></div><div class="filter-row"><input class="search-input" placeholder="搜索分类、备注、金额" aria-label="搜索账单" value="${esc(query)}" oninput="query=this.value;renderBillResults()"><select aria-label="账单类型" onchange="billType=this.value;renderBillResults()">${[['all','全部类型'],['expense','支出'],['income','收入'],['transfer','划转'],['adjust','余额调整']].map(([v,l])=>`<option value="${v}" ${v===billType?'selected':''}>${l}</option>`).join('')}</select><select aria-label="筛选币种" onchange="billCurrency=this.value;renderBillResults()">${[['all','全部币种'],...Object.entries(CUR)].map(([v,l])=>`<option value="${v}" ${v===billCurrency?'selected':''}>${l}</option>`).join('')}</select><select aria-label="计入规则筛选" onchange="billRule=this.value;renderBillResults()">${[['all','全部计入规则'],['no_budget','不计入预算'],['no_average','不计入日均支出'],['either','任一项不计入'],['both','两项均不计入']].map(([v,l])=>`<option value="${v}" ${v===billRule?'selected':''}>${l}</option>`).join('')}</select><button class="text-btn" onclick="exportCsv()">${icon('download',14)} 导出 CSV</button></div><div class="ledger-head"><span>分类 / 备注</span><span>账户</span><span>日期</span><span style="text-align:right">金额</span></div><div id="bill-results">${billResults(txs)}</div></div>`}

function matchesBillRule(t){let noBudget=['income','expense'].includes(t.type)&&t.budget===false,noAverage=t.type==='expense'&&t.average===false;switch(billRule){case 'no_budget':return noBudget;case 'no_average':return noAverage;case 'either':return noBudget||noAverage;case 'both':return noBudget&&noAverage;default:return true}}
function filteredBills(){let r=range('month',anchor);return state.transactions.filter(t=>(allBills||t.date>=r.start&&t.date<=r.end)&&(allBills||!calendarDay||calendarDay<r.start||calendarDay>r.end||t.date===calendarDay)&&(billType==='all'||t.type===billType)&&(billCurrency==='all'||t.currency===billCurrency)&&matchesBillRule(t)&&(!query||[t.cat,t.sub,t.note,acc(t.account)?.name,t.amount].join(' ').toLowerCase().includes(query.toLowerCase())))}
function billResults(txs){return txs.length?txRows(txs):'<div class="empty">没有符合条件的账单</div>'}
function renderBillResults(){let txs=filteredBills();$('#bill-results').innerHTML=billResults(txs);$('#bill-count').textContent=txs.length+' 笔'}

function trendChart(r,s){let byDate=new Map();for(let t of s.rows){let p=byDate.get(t.date)||{expense:0,income:0};p[t.type]+=t.cny;byDate.set(t.date,p)}let points=[];for(let d=r.start;d<=r.end;d=addDays(d,1)){let p=byDate.get(d)||{expense:0,income:0};points.push({date:d,expense:round(p.expense),income:round(p.income),net:round(p.income-p.expense)})}if(!points.some(p=>p.date===trendDay))trendDay=TODAY>=r.start&&TODAY<=r.end?TODAY:TODAY<r.start?r.start:r.end;let selected=points.findIndex(p=>p.date===trendDay),series=trendType==='all'?['expense','income','net']:[trendType],all=points.flatMap(p=>series.map(k=>p[k])),max=Math.max(1,...all),min=Math.min(0,...all),height=148,w=window.innerWidth<=650?330:750,y=n=>20+(max-n)/(max-min)*height,x=i=>45+i/Math.max(1,points.length-1)*(w-65),color={expense:'#c79b66',income:'#7da78a',net:'#92a9c3'},zero=y(0),step=(w-65)/Math.max(1,points.length-1),chosen=points[selected];return `<svg class="chart trend-chart" viewBox="0 0 ${w} 205" role="group" aria-label="每日收入支出结余趋势，点击日期查看收支">${[0,.5,1].map(v=>{let val=max-(max-min)*v;return `<line x1="45" x2="${w-15}" y1="${20+v*height}" y2="${20+v*height}" stroke="#edf1eb" stroke-dasharray="3 5"/><text x="35" y="${24+v*height}" text-anchor="end">${Math.round(val).toLocaleString()}</text>`}).join('')}${min<0?`<line x1="45" x2="${w-15}" y1="${zero}" y2="${zero}" stroke="#d9e1d9"/>`:''}<line x1="${x(selected)}" x2="${x(selected)}" y1="14" y2="170" stroke="#a8bcae" stroke-dasharray="4 4"/>${series.map(k=>`<polyline points="${points.map((p,i)=>`${x(i)},${y(p[k])}`).join(' ')}" fill="none" stroke="${color[k]}" stroke-width="2" stroke-linejoin="round"/>${points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[k])}" r="${i===selected?5:points.length>60?1:3}" fill="${color[k]}" ${i===selected?'stroke="white" stroke-width="2"':''}/>`).join('')}`).join('')}${points.filter((p,i)=>i===0||i===points.length-1||i%Math.max(1,Math.floor(points.length/6))===0).map(p=>`<text x="${x(points.indexOf(p))}" y="194" text-ancho function ranking(s){let rows=s.rows.filter(t=>t.type===rankType),total=rows.reduce((n,t)=>n+t.cny,0),cats=Object.keys(CATS[rankType]).map(c=>[c,rows.filter(t=>t.cat===c).reduce((n,t)=>n+t.cny,0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),cum=0;let gradient=cats.map(([c,n],i)=>{let a=cum;cum+=n/total*100;return `${COLORS[i%COLORS.length]} ${a}% ${cum}%`}).join(',');return `<div class="donut-wrap"><div class="donut" style="background:${total?`conic-gradient(${gradient})`:'#f0f3ed'}"><div class="donut-center"><div class="tiny muted">总${rankType==='expense'?'支出':'收入'}</div><div class="num" style="font-size:25px;font-weight:700;margin-top:7px">${money(total)}</div><div class="tiny muted" style="margin-top:5px">折合人民币</div></div></div><div class="stack" style="gap:14px">${cats.slice(0,4).map(([c,n],i)=>`<div class="flex small"><span style="width:8px;height:8px;border-radius:3px;background:${COLORS[i]}"></span><span>${c}</span><b class="num">${(n/total*100).toFixed(1)}%</b></div>`).join('')||'<span class="muted small">等待第一笔记录</span>'}</div></div>${cats.map(([c,n],i)=>`<button type="button" class="rank rank-link" aria-label="查看${esc(c)}${rankType==='expense'?'支出':'收入'}账单明细" onclick="openCategoryBills('${c}')"><span class="between"><span class="flex"><span class="tiny muted num">${String(i+1).padStart(2,'0')}</span><span>${CATSTYLE[c][0]} ${c}</span><span class="tiny muted">${(n/total*100).toFixed(1)}%</span></span><span class="flex" style="gap:8px"><b class="small num">${money(n)}</b><span class="muted">${icon('chevron',14)}</span></span></span><span class="progress"><span class="progress-fill" style="width:${n/total*100}%;background:${COLORS[i%COLORS.length]}"></span></span></button>`).join('')}`}

function openCategoryBills(category){if(!Object.hasOwn(CATS[rankType],category))return;let r=range(),rows=summary(r).rows.filter(t=>t.type===rankType&&t.cat===category),total=round(rows.reduce((n,t)=>n+t.cny,0));modal(esc(category)+' · '+(rankType==='expense'?'支出':'收入')+'明细',`<div class="between category-bills-summary"><span class="small muted">${r.label} · ${rows.length} 笔</span><b class="num">${money(total)}</b></div><div class="category-bills">${rows.length?txRows(rows):'<div class="empty">暂无该分类账单</div>'}</div>`,`<button class="btn secondary" onclick="closeModal()">关闭</button>`)}

function statsPage(){let r=range(),s=summary(r),b=budgetFor(r),pct=b.total?s.budgetSpent/b.total*100:0,expected=b.total*r.elapsed/r.total;return `<div class="heading stat-heading"><div><h1>统计，一目了然</h1><p>看见钱的去向，也看见生活的模样。</p></div><div class="page-actions"><div class="tabs">${[['year','年度'],['month','月度'],['week','周度']].map(([v,l])=>`<button class="${period===v?'active':''}" onclick="periodPick('${v}')">${l}</button>`).join('')}</div>${picker()}</div></div><div class="stats-grid"><div class="card"><div class="card-title"><h2>收支总览</h2><span class="tiny muted">人民币 CNY</span></div><div class="overview-grid">${[['支出',s.expense,''],['收入',s.income,''],['结余',s.net,'green'],['日均支出',r.elapsed?s.avgExpense/r.elapsed:0,''],['日均收入',r.elapsed?s.income/r.elapsed:0,''],['日均结余',r.elapsed?s.net/r.elapsed:0,'green']].map(([l,n,c])=>`<div><div class="small muted">${l}</div><div class="num ${c}">${money(n)}</div></div>`).join('')}</div><div class="insight">按已过去 ${r.elapsed} 天计算日均。日均支出遵循单笔开关，日均结余包含全部支出。</div></div><div class="card"><div class="card-title"><h2>预算概览</h2><button class="text-btn" onclick="openBudget()">调整预算 ${icon('chevron',13)}</button></div><div class="between"><div><div class="small muted">剩余预算</div><div class="budget-number num ${pct>100?'red':'green'}">${b.total?money(b.total-s.budgetSpent):'未设置'}</div></div><span class="pill">已用 ${b.total?Math.round(pct)+'%':'—'}</span></div><div class="progress" style="height:13px;margin:23px 0"><div class="progress-fill" style="width:${Math.min(100,pct)}%;${pct>100?'background:#ce9483':''}"></div><div class="marker" style="left:${r.elapsed/r.total*100}%" title="截至今天应花 ${money(expected)}"></div></div><div class="between small muted"><span>已用 <b class="num" style="color:var(--ink)">${money(s.budgetSpent)}</b></span><span>总预算 <b class="num" style="color:var(--ink)">${money(b.total)}</b></span></div><div class="insight"><span style="display:inline-block;width:2px;height:10px;background:#b18f5c;margin-right:7px"></span>进度线：${money(b.total)} ÷ ${r.total} 天 × ${r.elapsed} 天 = ${money(expected)}</div></div><div class="card stats-full"><div class="card-title"><h2>每日趋势</h2><div class="tabs">${[['all','全部'],['expense','支出'],['income','收入'],['net','结余']].map(([k,l])=>`<button class="${trendType===k?'active':''}" onclick="trendType='${k}';render()">${l}</button>`).join('')}</div></div><div class="legend"><span><b style="background:#c79b66"></b>支出</span><span><b style="background:#7da78a"></b>收入</span><span><b style="background:#92a9c3"></b>结余</span><span style="margin-left:auto">每日 · 人民币</span></div>${trendChart(r,s)}</div><div class="card"><div class="card-title"><h2>分类排行</h2><div class="tabs">${[['expense','支出'],['income','收入']].map(([k,l])=>`<button class="${rankType===k?'active':''}" onclick="rankType='${k}';render()">${l}</button>`).join('')}</div></div>${ranking(s)}</div><div class="stack"><div class="card"><div class="card-title"><h2>分币种收支</h2><span class="tiny muted">原币金额</span></div><table class="currency-table"><thead><tr><th>币种</th><th>支出</th><th>收入</th><th>结余</th></tr></thead><tbody>${Object.keys(CUR).map(c=>{let out=s.rows.filter(t=>t.currency===c&&t.type==='expense').reduce((n,t)=>n+t.amount,0),inc=s.rows.filter(t=>t.currency===c&&t.type==='income').reduce((n,t)=>n+t.amount,0);return `<tr><td>${CUR[c]}<br><span class="tiny muted">${c}</span></td><td class="num">${money(out,c)}</td><td class="num green">${money(inc,c)}</td><td class="num">${money(inc-out,c)}</td></tr>`}).join('')}</tbody></table><p class="help" style="margin-top:15px">人民币总览使用各笔账单保存的汇率快照；此处按原币分别汇总。</p></div><div class="card"><div class="card-title"><h2>分类预算</h2><span class="tiny muted">仅计入预算的支出</span></div>${Object.entries(b.categories||{}).filter(x=>x[1]>0).map(([c,total])=>{let spent=s.rows.filter(t=>t.type==='expense'&&t.budget&&t.cat===c).reduce((n,t)=>n+t.cny,0);return `<div class="mini-budget"><div class="between small"><span>${CATSTYLE[c]?.[0]} ${c}</span><span class="num ${spent>total?'red':'muted'}">${money(spent)} / ${money(total)}</span></div><div class="progress"><div class="progress-fill" style="width:${Math.min(100,spent/total*100)}%;${spent>total?'background:#ce9483':''}"></div></div></div>`}).join('')||'<p class="help">还没有设置本时段的分类预算。</p>'}</div></div></div>`}
function settingsPage(){return `<div class="heading"><div><h1>我的设置</h1><p>按你的习惯，打理自己的小账本。</p></div>${settingsTab==='accounts'?'<button class="btn" onclick="openAccount()">'+icon('plus',16)+' 新建账户</button>':''}</div><div class="settings-tabs">${[['accounts','资产账户'],['budgets','预算设置'],['categories','记账分类'],['backup','备份与数据']].map(([k,l])=>`<button class="${settingsTab===k?'active':''}" onclick="settingsTab='${k}';render()">${l}</button>`).join('')}</div>${settingsTab==='accounts'?accountsView():settingsTab==='budgets'?budgetsView():settingsTab==='categories'?categoriesView():backupView()}`}
function accountsView(){let activeAccounts=state.accounts.filter(a=>a.active),inactiveCount=state.accounts.length-activeAccounts.length;return `<div class="between settings-header"><h2>${activeAccounts.length} 个使用中账户</h2><div class="flex" style="flex-wrap:wrap;justify-content:flex-end"><button class="text-btn" onclick="openInactiveAccounts()">已停用账户 (${inactiveCount}) ${icon('chevron',13)}</button><button class="btn ghost" onclick="openTransfer()">${icon('transfer',16)} 账户划转</button></div></div><div class="account-groups">${['普通账户','投资账户','信用账户','充值账户','负债账户'].filter(type=>type!=='负债账户'||activeAccounts.some(a=>a.type===type)).map(type=>{let accounts=activeAccounts.filter(a=>a.type===type),saved=accountGroupPreferences(),isOpen=typeof saved[type]==='boolean'?saved[type]:type==='普通账户';return `<details class="account-group" data-account-type="${esc(type)}" ${isOpen?'open':''} ontoggle="rememberAccountGroup(this)"><summary><span class="flex"><span class="green">${icon(type==='投资账户'?'chart':'wallet',18)}</span><h2>${type}</h2><span class="account-group-count">${accounts.length} 个</span></span><span class="account-group-chevron">${icon('chevron',18)}</span></summary><div class="account-group-content">${accounts.length?`<div class="account-grid">${accounts.map(accountCard).join('')}</div>`:'<div class="empty small">暂无使用中的'+type+'</div>'}</div></details>`}).join('')}</div>`}

function accountGroupPreferences(){try{let value=JSON.parse(localStorage.getItem(KEY+'-account-groups')||'{}');return value&&typeof value==='object'&&!Array.isArray(value)?value:{}}catch{return {}}}
function rememberAccountGroup(element){try{let preferences=accountGroupPreferences();preferences[element.dataset.accountType]=element.open;localStorage.setItem(KEY+'-account-groups',JSON.stringify(preferences))}catch{}}
function accountCard(a){return `<div class="card account-card ${a.active?'':'inactive'}"><div class="between"><button class="account-name flex" onclick="openAccountBills('${a.id}')" aria-label="查看${esc(a.name)}账户明细"><span class="asset-icon">${icon('wallet',18)}</span><h2>${esc(a.name)}</h2><span class="account-detail-arrow">${icon('chevron',14)}</span></button><button class="icon-btn" aria-label="编辑账户" onclick="openAccount('${a.id}')">${icon('edit',16)}</button></div><div class="tiny muted" style="margin-top:12px">${a.type} · ${a.active?'使用中':'已停用'}${a.include?'':' · 不计总资产'}${(a.pendingCurrencies||[]).length?' · 请调整真实余额':''}</div><button class="account-balances" onclick="openAccountBills('${a.id}')" aria-label="查看${esc(a.name)}账户明细">${a.currencies.map(c=>`<div class="between" style="margin-top:16px"><span class="small muted">${CUR[c]}</span><b class="num ${balance(a,c)<0?'orange':''}" style="font-size:20px">${(a.pendingCurrencies||[]).includes(c)?'待校准':money(balance(a,c),c)}</b></div>`).join('')}</button><div class="account-actions"><button onclick="openAdjust('${a.id}')">调整余额</button><button onclick="toggleAccount('${a.id}')">${a.active?'停用账户':'启用账户'}</button><button onclick="openTransfer('${a.id}')">划转</button></div></div>`}

function budgetsView(){return `<div class="card budget-settings"><div class="card-title"><h2>每一段时间，都有自己的计划</h2></div><p class="help">年度、月度、周度预算独立设置，单位统一为人民币。可以为具体时段及一级分类设置预算；同一笔账单会分别纳入所属年、月、周统计。</p><div class="flex" style="margin:24px 0;flex-wrap:wrap"><div class="tabs">${[['year','年度'],['month','月度'],['week','周度']].map(([v,l])=>`<button class="${period===v?'active':''}" onclick="periodPick('${v}')">${l}</button>`).join('')}</div>${picker()}</div><div class="between"><span>本时段总预算</span><b class="num" style="font-size:26px">${money(budgetFor(range()).total)}</b></div><div style="margin-top:22px"><button class="btn" onclick="openBudget()">${icon('edit',15)} 设置总预算及分类预算</button></div></div>`}
function categoriesView(){return `<div class="stats-grid">${Object.entries(CATS).map(([type,cats])=>`<div class="card"><h2>${type==='expense'?'支出分类':'收入分类'}</h2>${Object.entries(cats).map(([c,subs])=>`<div style="padding:17px 0;border-bottom:1px solid var(--line)"><div class="flex">${catIcon(c)}<b>${c}</b></div>${subs.length?`<div class="category-list">${subs.map(s=>`<span>${s}</span>`).join('')}</div>`:''}</div>`).join('')}</div>`).join('')}</div>`}
function backupView(){return `<div class="stack" style="max-width:800px"><div class="card"><h2>账本备份</h2><p class="help" style="margin:15px 0 20px">数据保存在当前浏览器，不会自动同步到其他设备。完整 JSON 备份包含账户、原币余额、账单、汇率快照和预算，可在其他设备恢复；CSV 适合用表格查看。</p><div class="toggle-actions"><button class="btn" onclick="exportBackup()">${icon('download',16)} 导出完整备份</button><button class="btn ghost" onclick="exportCsv()">导出账单 CSV</button><button class="btn ghost" onclick="$('#import-file').click()">恢复 JSON 备份</button><input type="file" id="import-file" class="file-input" accept=".json,application/json" onchange="importBackup(this.files[0])"></div></div><div class="card"><h2>文字识别与汇率</h2><p class="help" style="margin-top:14px">本地文字规则识别金额、常见消费词、日期及币种。默认人民币，“刀 / 美刀 / USD”识别为美元，“港币 / 港元 / HKD”识别为港币。保存前可修改识别结果。<br><br>汇率来自 Frankfurter 每日参考价，每 5 分钟重新检查；补记历史日期会尝试获取该日参考价。网络不可用时可手动输入汇率，外币账单必须有有效汇率才可保存。账单保存汇率快照及人民币金额，调整日期会重新获取参考价。</p><a class="small" href="https://frankfurter.dev/v1/" target="_blank" rel="noreferrer" style="display:inline-block;margin-top:14px">查看汇率来源说明 ↗</a></div><div class="card"><h2>${state.demo?'当前为示例账本':'重新开始'}</h2><p class="help" style="margin:14px 0 20px">${state.demo?'示例账单仅用于体验界面，不是你的实际收支。':'新建空白账本会移除本浏览器现有账本。'}建议先导出完整备份，再开始新的空白账本。</p><button class="btn danger" onclick="confirmNew()">创建空白账本</button></div></div>`}

ck="confirmNew()">开始我的账本</button></div>`:''}<span class="pill"><span class="dot"></span>数据保存在本机</span><span class="small muted">${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][dateObj(TODAY).getDay()]}</span><div class="avatar">我</div></div></header>${view==='entry'?entryPage():view==='details'?detailsPage():view==='stats'?statsPage():settingsPage()}<footer class="footer">${view==='entry'?'<div class="entry-motto"><div class="eyebrow">A LITTLE RECORD, A CLEARER LIFE</div><div class="entry-motto-title">每一笔，都算数。</div><p>记下生活里的小事，让每一份收支都有迹可循。</p><p>认真生活，从记下每一笔开始。不必每次都完美，慢慢积累就很好。</p></div>':''}轻记 QINGJI <span style="margin:0 8px">·</span> 好好生活，慢慢记录 ${state.demo?'<span style="margin-left:10px">当前展示示例数据</span>':''}</footer></main>`}
function toast(s){clearTimeout(toastTimer);$('#toast').textContent=s;$('#toast').style.display='block';toastTimer=setTimeout(()=>$('#toast').style.display='none',3500)}
function closeModal(){clearTimeout(rateTimer);fxRequest++;$('#modal-root').innerHTML='';modalTx=null}
function modal(title,body,actions){$('#modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="icon-btn" aria-label="关闭" onclick="closeModal()">${icon('close',19)}</button></div>${body}<div id="form-error" class="error" role="alert"></div><div class="modal-actions">${actions}</div></section></div>`;setTimeout(()=>$('.modal input, .modal select, .modal button')?.focus(),30)}
function formError(e){$('#form-error').textContent=e.message||e;$('#form-error').style.display='block'}
const field=(label,html,full=false)=>`<div class="field ${full?'full':''}"><label ${html.match(/id="([^"]+)"/)?.[1]?`for="${html.match(/id="([^"]+)"/)[1]}"`:''}>${label}</label>${html}</div>`;
const opts=(xs,value)=>xs.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('');
function openTx(t={}){modalTx=t.id?t:null;let type=t.type||'expense',accounts=state.accounts.filter(a=>a.active||a.id===t.account),account=accounts.find(a=>a.id===t.account)||accounts[0];if(!account){toast('请先启用或创建一个账户');return}let currency=t.currency||'CNY';modal(t.id?'编辑账单':t.recognized?'确认识别结果':'记一笔',`${t.legacy?`<div class="notice">迁移记录 · 原分类 ${esc(t.legacy.originalCategory||'')}<br>原时间 ${esc(t.legacy.rows?.[0]?.record?.['时间']||t.date)}${t.rateSource?.includes('迁移补算')?'<br>人民币金额采用历史参考价补算，可修改实际汇率。':''}</div>`:''}${t.recognized?`<div class="notice">已识别：${esc(t.note)}。请确认分类、金额与账户后保存。</div>`:''}<div class="form-grid">${field('收支类型',`<select id="tx-type" onchange="txTypeChange()">${opts(['expense','income'],type).replace('>expense<','>支出<').replace('>income<','>收入<')}</select>`)}${field('记账日期',`<input id="tx-date" type="date" value="${t.date||TODAY}" onchange="requestFormRate()">`)}${field('一级分类',`<select id="tx-cat" onchange="txSubs()">${opts(Object.keys(CATS[type]),t.cat||Object.keys(CATS[type])[0])}</select>`)}${field('二级分类',`<select id="tx-sub"></select>`)}${field('扣款 / 收款账户',`<select id="tx-account" onchange="txCurrencies()">${accounts.map(a=>`<option value="${a.id}" ${a.id===account.id?'selected':''}>${esc(a.name)}${a.active?'':'（停用）'}</option>`).join('')}</select>`)}${field('币种',`<select id="tx-currency" onchange="requestFormRate()"></select>`)}${field('金额',`<input id="tx-amount" type="number" min="0.01" step="0.01" value="${t.amount||''}" placeholder="0.00" oninput="rateHint()">`)}${field('1 原币折合人民币',`<input id="tx-rate" type="number" step="0.000001" min="0.000001" value="${t.rate||1}" oninput="this.dataset.manual='true';rateHint()"><span id="rate-hint" class="help"></span>`)}${field('备注',`<input id="tx-note" maxlength="200" placeholder="记录生活的小细节" value="${esc(t.note||'')}">`,true)}<div class="field full checks"><label class="check"><input id="tx-budget" type="checkbox" ${t.budget===false?'':'checked'}>计入预算</label><label class="check" id="average-label"><input id="tx-average" type="checkbox" ${t.average===false?'':'checked'}>计入日均支出（不影响日均结余）</label></div></div>`,`${t.id?`<button class="btn danger" style="margin-right:auto" onclick="deleteTx('${t.id}')">删除</button>`:''}<button class="btn secondary" onclick="closeModal()">取消</button><button class="btn" onclick="saveTx()">${icon('check',15)} 保存账单</button>`);txSubs(t.sub);txCurrencies(currency,false);$('#tx-rate').value=t.rate||state.rates[$('#tx-currency').value]||'';$('#tx-rate').dataset.source=t.rateSource||'参考汇率';$('#tx-rate').dataset.date=t.rateDate||state.rateDate||TODAY;$('#average-label').style.display=type==='expense'?'flex':'none';if(t.rate&&$('#tx-currency').value===t.currency){$('#tx-rate').dataset.manual='preserve';rateHint()}else requestFormRate()}
function txSubs(value=''){let list=CATS[$('#tx-type').value][$('#tx-cat').value]||[];$('#tx-sub').innerHTML='<option value="">不细分</option>'+opts(list,value)}
function txTypeChange(){let type=$('#tx-type').value;$('#tx-cat').innerHTML=opts(Object.keys(CATS[type]));txSubs();$('#average-label').style.display=type==='expense'?'flex':'none'}

function saveBudget(key){try{let total=round(Number($('#b-total').value)),categories={};for(let el of $$('[data-budget-cat]')){let n=round(Number(el.value));if(!Number.isFinite(n)||n<0||n>1e12)throw Error('预算须为非负的有效金额');if(n)categories[el.dataset.budgetCat]=n}if(!Number.isFinite(total)||total<0||total>1e12)throw Error('请填写有效总预算');state.budgets[key]={total,categories};persist();closeModal();render();toast('预算已更新')}catch(e){formError(e)}}
async function fetchRate(d,c){let target=d>=TODAY?'latest':d;let response=await fetch(`https://api.frankfurter.dev/v1/${target}?base=${c}&symbols=CNY`,{signal:AbortSignal.timeout(10000)});if(!response.ok)throw Error('汇率服务暂不可用');let j=await response.json();if(!Number.isFinite(j.rates?.CNY)||j.rates.CNY<=0)throw Error('无可用汇率');return {date:j.date,rates:{[c]:j.rates.CNY}}}
async function refreshRates(manual=false){try{let results=await Promise.all(['USD','HKD'].map(c=>fetchRate(TODAY,c)));for(let d of results)Object.assign(state.rates,d.rates);state.rateDate=results.map(x=>x.date).sort()[0];state.rateProvider='Frankfurter';state.checkedAt=new Date().toISOString();persist();if(!$('#modal-root').children.length){let text=$('#quick-text')?.value,account=$('#quick-account')?.value;render();if($('#quick-text'))$('#quick-text').value=text||'';if(account&&$('#quick-account'))$('#quick-account').value=account}if(manual)toast('参考汇率已更新，历史账单保持原汇率')}catch{if(manual)toast('汇率获取失败，保留已有参考价；记账时可手动填写');}}
function download(name,text,type){let url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportBackup(){download('轻记-完整备份-'+TODAY+'.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json');toast('完整账本备份已导出')}
function exportCsv(){const cell=x=>'"'+String(x??'').replace(/^[=+@\-]/,"'$&").replaceAll('"','""')+'"';let rows=[['日期','类型','一级分类','二级分类','账户','原币','金额','汇率','折合人民币','计入预算','计入日均支出','备注','入账账户','到账币种','到账金额','手续费','手续费扣除方式'],...state.transactions.map(t=>[t.date,{income:'收入',expense:'支出',transfer:'划转',adjust:'余额调整'}[t.type],t.cat,t.sub,acc(t.account||t.from)?.name,t.currency,t.amount??t.delta,t.rate,t.cny,t.budget?'是':'否',t.average?'是':'否',t.note,acc(t.to)?.name,t.toCurrency,t.credit,t.fee,t.feeMode==='extra'?'额外扣除':t.feeMode==='inside'?'从款项扣除':''])];download('轻记-全部账单-'+TODAY+'.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('全部账单 CSV 已导出')}
function confirmNew(){modal('开始自己的账本',`<p class="help">创建空白账本将替换当前浏览器中的${state.demo?'示例':'现有'}数据。你可以先下载完整备份留存。</p><div style="margin-top:20px"><button class="btn ghost" onclick="exportBackup()">${icon('download',15)} 先导出当前账本</button></div>`,`<button class="btn secondary" onclick="closeModal()">取消</button><button class="btn" onclick="newLedger()">创建空白账本</button>`)}
function newLedger(){let rates=state.rates,rateDate=state.rateDate,checkedAt=state.checkedAt;state=initial(false);Object.assign(state,{rates,rateDate,checkedAt});persist();closeModal();navigate('entry');toast('你的空白账本已准备好')}
function validateImport(s){if(!s||s.version!==1||!Array.isArray(s.accounts)||!Array.isArray(s.transactions)||!s.accounts.length||s.accounts.length>500||s.transactions.length>100000||!s.budgets||typeof s.budgets!=='object'||!s.rates)throw Error('文件不是有效的轻记 v1 备份');let ids=new Set(),txids=new Set(),isNum=n=>typeof n==='number'&&Number.isFinite(n)&&Math.abs(n)<=1e14,validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(+dateObj(d));for(let a of s.accounts){if(a.pendingCurrencies!==undefined&&(!Array.isArray(a.pendingCurrencies)||a.pendingCurrencies.some(c=>!a.currencies?.includes(c))))throw Error('待校准币种无效');if(typeof a.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(a.id)||ids.has(a.id)||typeof a.name!=='string'||!TYPES.includes(a.type)||!Array.isArray(a.currencies)||!a.currencies.length||new Set(a.currencies).size!==a.currencies.length||a.currencies.some(c=>!Object.hasOwn(CUR,c)||!isNum(a.opening?.[c]))||typeof a.active!=='boolean'||typeof a.include!=='boolean')throw Error('账户数据不完整或有重复');ids.add(a.id)}for(let t of s.transactions){if(typeof t.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(t.id)||txids.has(t.id)||!validDate(t.date)||!Object.hasOwn(CUR,t.currency)||!['income','expense','transfer','adjust'].includes(t.type))throw Error('账单标识或日期无效');txids.add(t.id);let a=s.accounts.find(a=>a.id===(t.account||t.from));if(!a?.currencies.includes(t.currency))throw Error('账单引用了不存在的账户或币种');if(t.type==='adjust'){if(!isNum(t.delta))throw Error('余额调整无效')}else if(t.type==='transfer'){let target=s.accounts.find(a=>a.id===t.to);if(!target?.currencies.includes(t.toCurrency)||![t.amount,t.debit,t.credit,t.fee].every(isNum)||t.amount<=0||t.credit<=0||t.fee<0||!['extra','inside'].includes(t.feeMode)||t.debit!==round(t.amount+(t.feeMode==='extra'?t.fee:0)))throw Error('划转金额无效')}else if(!Object.hasOwn(CATS[t.type],t.cat)||typeof t.sub!=='string'||t.sub&&!CATS[t.type][t.cat].includes(t.sub)||!isNum(t.amount)||t.amount<=0||!isNum(t.rate)||t.rate<=0||!isNum(t.cny)||Math.abs(t.cny-round(t.amount*t.rate))>.011||t.currency==='CNY'&&t.rate!==1||typeof t.budget!=='boolean'||typeof t.average!=='boolean')throw Error('账单分类、金额或汇率无效');if(t.note!==undefined&&(typeof t.note!=='string'||t.note.length>2000))throw Error('备注数据无效')}
for(let t of s.transactions.filter(t=>t.transferId)){let parent=s.transactions.find(x=>x.id===t.transferId);if(!parent||parent.type!=='transfer'||t.type!=='expense'||t.amount!==parent.fee||t.account!==parent.from||t.currency!==parent.currency)throw Error('手续费关联无效')}for(let t of s.transactions.filter(t=>t.type==='transfer'&&t.fee>0))if(s.transactions.filter(x=>x.transferId===t.id).length!==1)throw Error('缺少划转手续费记录');for(let [key,b]of Object.entries(s.budgets)){if(!/^(month:\d{4}-\d{2}|year:\d{4}|week:\d{4}-\d{2}-\d{2})$/.test(key)||!isNum(b.total)||b.total<0||!b.categories||Object.entries(b.categories).some(([c,n])=>!Object.hasOwn(CATS.expense,c)||!isNum(n)||n<0))throw Error('预算数据无效')}if(s.rates.CNY!==1||['HKD','USD'].some(c=>s.rates[c]!==null&&(!isNum(s.rates[c])||s.rates[c]<=0)))throw Error('汇率缓存无效');checkBalances(s.transactions,s.accounts);return s}
async function importBackup(file){if(!file)return;try{if(file.size>25000000)throw Error('备份文件过大');let s=validateImport(JSON.parse(await file.text()));modal('恢复完整备份',`<div class="notice">备份包含 ${s.accounts.length} 个账户、${s.transactions.length} 条记录。恢复会替换当前浏览器中的账本。</div><button class="btn ghost" onclick="exportBackup()">先备份当前账本</button>`,`<button class="btn secondary" onclick="closeModal()">取消</button><button class="btn" id="confirm-import">确认恢复</button>`);$('#confirm-import').onclick=()=>{let prior=state;try{state=s;persist();closeModal();render();toast('备份已完整恢复')}catch{state=prior;formError('恢复失败，当前账本已保留')}}}catch(e){toast(e.message||'备份格式不正确')}}


document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&$('#quick-text'))parseQuick()});
render();refreshRates();setInterval(()=>refreshRates(),300000);
</script></body></html>
